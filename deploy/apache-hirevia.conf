<VirtualHost *:80>
    ServerName ${DOMAIN}
    ServerAdmin webmaster@${DOMAIN}

    DocumentRoot ${WEB_ROOT}

    ProxyPreserveHost On
    ProxyTimeout 180
    RequestHeader set X-Forwarded-Proto "http"

    AddType application/wasm .wasm

    ProxyPass /api/ http://127.0.0.1:${API_PORT}/api/
    ProxyPassReverse /api/ http://127.0.0.1:${API_PORT}/api/

    LimitRequestBody 3145728

    <Directory ${WEB_ROOT}>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/hirevia-error.log
    CustomLog ${APACHE_LOG_DIR}/hirevia-access.log combined
</VirtualHost>
